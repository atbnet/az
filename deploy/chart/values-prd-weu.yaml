env: prd
region: weu

image:
  repository: acrwebprdglobal.azurecr.io/web

replicaCount: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

agc:
  hostnames: []
  tls:
    enabled: true
    secretName: web-tls
