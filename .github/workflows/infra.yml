name: infra

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [dev, main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        type: choice
        options: [dev, prd]
        default: dev

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.13.0"
  GATEWAY_API_VERSION: "v1.2.1"
  ALB_CONTROLLER_VERSION: "1.4.1"

jobs:
  resolve:
    name: resolve env
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
      action: ${{ steps.pick.outputs.action }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_BASE: ${{ github.base_ref }}
          REF_HEAD: ${{ github.ref_name }}
          DISPATCH_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              case "$REF_BASE" in
                dev)  echo "env=dev" >> "$GITHUB_OUTPUT" ;;
                main) echo "env=prd" >> "$GITHUB_OUTPUT" ;;
                *)    echo "unsupported PR base: $REF_BASE" >&2; exit 1 ;;
              esac
              echo "action=plan" >> "$GITHUB_OUTPUT"
              ;;
            push)
              case "$REF_HEAD" in
                dev)  echo "env=dev" >> "$GITHUB_OUTPUT" ;;
                main) echo "env=prd" >> "$GITHUB_OUTPUT" ;;
                *)    echo "unsupported branch: $REF_HEAD" >&2; exit 1 ;;
              esac
              echo "action=apply" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "env=${DISPATCH_ENV}" >> "$GITHUB_OUTPUT"
              echo "action=apply" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform -chdir=infra fmt -check -recursive

  plan:
    name: plan (${{ needs.resolve.outputs.env }})
    needs: [resolve, fmt]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.env }}
    concurrency:
      group: infra-${{ needs.resolve.outputs.env }}
      cancel-in-progress: false
    env:
      ENV: ${{ needs.resolve.outputs.env }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_repo: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Azure credentials are set
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Azure credentials for env='${ENV}':${missing}."
            echo "::error::Set them as secrets OR variables on the GitHub Environment '${ENV}' (Settings -> Environments -> ${ENV})."
            echo "::error::Values come from the 'infra/bootstrap' terraform outputs (github_oidc_client_id, tenant_id, subscription_id)."
            exit 1
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Resolve state storage account
        run: |
          hcl="infra/envs/backends/${ENV}.hcl"
          if grep -q REPLACE_AFTER_BOOTSTRAP "$hcl"; then
            rg="rg-web-tfstate-${ENV}"
            sa=$(az storage account list --resource-group "$rg" --query "[?tags.env=='${ENV}'] | [0].name" -o tsv 2>/dev/null || true)
            if [ -z "$sa" ]; then
              sa=$(az storage account list --resource-group "$rg" --query "[0].name" -o tsv 2>/dev/null || true)
            fi
            if [ -z "$sa" ]; then
              echo "::error::No state storage account found in resource group '$rg'. Has 'infra/bootstrap' been applied for env='${ENV}'?"
              exit 1
            fi
            echo "Using state storage account: $sa"
            sed -i "s/REPLACE_AFTER_BOOTSTRAP/$sa/" "$hcl"
          fi
      - run: terraform -chdir=infra init -backend-config="envs/backends/${ENV}.hcl" -reconfigure
      - run: terraform -chdir=infra validate
      - id: plan
        run: |
          set -o pipefail
          terraform -chdir=infra plan \
            -var-file="envs/${ENV}.tfvars" \
            -out=tfplan \
            -detailed-exitcode | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}
          path: |
            infra/tfplan
            plan.txt
          retention-days: 7
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8').slice(-60000);
            const icon = process.env.PLAN_EXIT === '2' ? ':sparkles:' : ':white_check_mark:';
            const body = [
              `## ${icon} Terraform plan (\`${process.env.ENV || '${{ env.ENV }}'}\`)`,
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    name: apply (${{ needs.resolve.outputs.env }})
    if: needs.resolve.outputs.action == 'apply'
    needs: [resolve, plan]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.env }}
    concurrency:
      group: infra-${{ needs.resolve.outputs.env }}
      cancel-in-progress: false
    outputs:
      clusters: ${{ steps.tfout.outputs.clusters }}
    env:
      ENV: ${{ needs.resolve.outputs.env }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_repo: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}
      - name: Resolve state storage account
        run: |
          hcl="infra/envs/backends/${ENV}.hcl"
          if grep -q REPLACE_AFTER_BOOTSTRAP "$hcl"; then
            rg="rg-web-tfstate-${ENV}"
            sa=$(az storage account list --resource-group "$rg" --query "[?tags.env=='${ENV}'] | [0].name" -o tsv 2>/dev/null || true)
            if [ -z "$sa" ]; then
              sa=$(az storage account list --resource-group "$rg" --query "[0].name" -o tsv 2>/dev/null || true)
            fi
            if [ -z "$sa" ]; then
              echo "::error::No state storage account found in resource group '$rg'. Has 'infra/bootstrap' been applied for env='${ENV}'?"
              exit 1
            fi
            echo "Using state storage account: $sa"
            sed -i "s/REPLACE_AFTER_BOOTSTRAP/$sa/" "$hcl"
          fi
      - run: terraform -chdir=infra init -backend-config="envs/backends/${ENV}.hcl" -reconfigure
      - run: terraform -chdir=infra apply -auto-approve tfplan
      - id: tfout
        run: |
          clusters=$(terraform -chdir=infra output -json clusters | jq -c .)
          echo "clusters=${clusters}" >> "$GITHUB_OUTPUT"

  bootstrap:
    name: bootstrap clusters (${{ needs.resolve.outputs.env }})
    needs: [resolve, apply]
    if: needs.resolve.outputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.env }}
    env:
      ENV: ${{ needs.resolve.outputs.env }}
      CLUSTERS_JSON: ${{ needs.apply.outputs.clusters }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.1.4
      - name: Install Gateway API CRDs + ALB Controller per cluster
        env:
          GATEWAY_API_VERSION: ${{ env.GATEWAY_API_VERSION }}
          ALB_CONTROLLER_VERSION: ${{ env.ALB_CONTROLLER_VERSION }}
        run: |
          set -euo pipefail
          echo "$CLUSTERS_JSON" | jq -c 'to_entries[]' | while read -r entry; do
            region=$(jq -r .key <<<"$entry")
            rg=$(jq -r .value.resource_group <<<"$entry")
            aks=$(jq -r .value.aks_name <<<"$entry")
            client_id=$(jq -r .value.controller_identity_client_id <<<"$entry")

            echo "::group::bootstrap $aks ($region)"
            az aks get-credentials --resource-group "$rg" --name "$aks" --overwrite-existing --only-show-errors
            kubelogin convert-kubeconfig -l azurecli

            kubectl apply --server-side -f \
              "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml"

            helm upgrade --install alb-controller \
              oci://mcr.microsoft.com/application-lb/charts/alb-controller \
              --version "${ALB_CONTROLLER_VERSION}" \
              --namespace azure-alb-system \
              --create-namespace \
              --set albController.namespace=azure-alb-system \
              --set albController.podIdentity.clientID="${client_id}" \
              --atomic \
              --timeout 5m

            kubectl -n azure-alb-system rollout status deploy/alb-controller --timeout=5m
            echo "::endgroup::"
          done
